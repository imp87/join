<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>

<body class="signupBody">

    <div class="signupHeader">
        <img src="../assets/icons/logo.svg" alt="Logo">
    </div>

    <main id="mainContent">

        <div class="signupFormWrapper">
            <form id="signupForm">
                <h2>Sign up</h2>
                <input type="text" id="name" placeholder="Name">
                <input type="email" id="email" placeholder="E-Mail">
                <input type="password" id="password" placeholder="Password">
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
                <label>
                    <input type="checkbox" class="checkbox" id="checkboxPrivacy">
                    I agree to the <a href="../pages/privacy.html" target="_blank">Privacy Policy</a>
                </label>
                <button type="submit" id="signupButton">Sign up</button>
            </form>
        </div>

    </main>

    <footer>
        <div class="footerLinks">
            <a href="../pages/privacy.html" target="_blank">Privacy Policy</a>
            <a href="../pages/legals.html" target="_blank">Legal notice</a>
        </div>
    </footer>

</body>

</html>
