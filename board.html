<!doctype html>
<html lang="com">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="./assets/img/Capa 1.svg" type="image/x-icon" />
  <script src="./scripts/board.js"></script>
  <script src="./scripts/task.js"></script>
  <script src="./scripts/tasktemplate.js"></script>
  <script src="./scripts/contacts-data.js"></script>
  <script src="./scripts/contacts-templates.js"></script>
  <script src="./scripts/contacts.js"></script>
  <script src="./scripts/auth.js"></script>
  <link rel="stylesheet" href="./css/task.css" />
  <link rel="stylesheet" href="./css/board.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>Join - Board</title>
</head>

<body onclick="
      submenuClose();
      addTaskClose();
      taskClose();
    " onload="setMinDate(); updateHTML(); loadContacts();" id="body">
  <header>
    <nav>
      <h2>Kanban Project Management Tool</h2>
      <div>
        <a href="./pages/help.html"><img src="./assets/img/help.svg" alt="help" /></a><button id="userInitials" onclick="
              submenuOpen();
              logDownWBubblingProtection(event);
            ">
          G
        </button>
      </div>
    </nav>
    <dialog onload="logDownWBubblingProtection(event)" id="submenu" class="submenu">
      <a class="help-submenu" href="./assets/img/help.svg">Help</a>
      <a href="./pages/legals.html">Legal Notice</a>
      <a href="./pages/privacy.html">Privacy Policy</a>
      <a href="./index.html" onclick="logoutUser()">Log out</a>
    </dialog>
  </header>
  <main>
    <div class="menu">
      <img src="./assets/img/Join logo vector.svg" alt="join logo" />
      <nav>
        <ul>
          <a class="menu-top" href="./summary.html"><img src="./assets/img/Vector.svg" alt="vector.svg" />Summary</a>
          <a class="menu-top" href="./task.html"><img src="./assets/img/edit_square.svg" alt="edit square png" />Add
            Task</a>
          <a class="current-page" href=""><img src="./assets/img/Iconshover.svg" alt="board icon" />Board</a>
          <a class="menu-top" href="./contacts.html"><img src="./assets/img/perm_contact_calendar.svg"
              alt="perm contact calendar.svg" />Contacts</a>
        </ul>

        <ul>
          <a class="menu-bottom" href="./pages/privacy.html">Privacy Policy</a>
          <a class="menu-bottom" href="./pages/legals.html">Legal notice</a>
        </ul>
      </nav>
    </div>

    <section>
      <div class="title">
        <h1>Board <a href="./task.html" class="add-task-mobile"><img src="./assets/img/plus add task mobile.svg"
              alt="add-task.button"></a></h1>

        <span>
          <div class="searchbar">
            <input type="search" id="search-bar" placeholder="Find Task" oninput="searchTasks()" />
            <div></div>
            <button class="search-btn">
              <img src="./assets/img/search.svg" alt="search svg" />
            </button>
          </div>

          <button class="add-task-btn" onclick="
                addtaskOpen();
                logDownWBubblingProtection(event);
              ">
            Add task <img src="./assets/img/add.svg" alt="add svg" />
          </button>
        </span>
      </div>
      <article>
        <figure>
          <div class="category">
            <h3>To do</h3>
            <button onclick="
                  addtaskOpen();
                  logDownWBubblingProtection(event);
                ">
              <img src="./assets/img/plus button.svg" alt="add svg" />
            </button>
            <a href="./task.html" class="plus-button-mobile">
              <img src="./assets/img/plus button mobile.svg" alt="plus-button">
            </a>
          </div>
          <div id="to-do" class="task-cards" ondrop="moveTo('To do'); removeHighlight('to-do');"
            ondragleave="removeHighlight('to-do')" ondragover="allowDrop(event); highlight('to-do')">
          </div>


        </figure>

        <figure onclick="
              logDownWBubblingProtection(event);
            ">
          <div class="category">
            <h3>In progress</h3>
            <button onclick="
                  addtaskOpen();
                  logDownWBubblingProtection(event);
                ">
              <img src="./assets/img/plus button.svg" alt="add svg" />
            </button>
            <a href="./task.html" class="plus-button-mobile">
              <img src="./assets/img/plus button mobile.svg" alt="plus-button">
            </a>
          </div>
          <div id="in-progress" class="task-cards" ondrop="moveTo('In progress'); removeHighlight('in-progress');"
            ondragleave="removeHighlight('in-progress')" ondragover="allowDrop(event); highlight('in-progress');">
          </div>
        </figure>

        <figure>
          <div class="category">
            <h3>Await feedback</h3>
            <button onclick="
                  addtaskOpen();
                  logDownWBubblingProtection(event);
                ">
              <img src="./assets/img/plus button.svg" alt="add svg" />
            </button>
            <a href="./task.html" class="plus-button-mobile">
              <img src="./assets/img/plus button mobile.svg" alt="plus-button">
            </a>
          </div>
          <div id="await-feedback" class="task-cards"
            ondrop="moveTo('Await feedback'); removeHighlight('await-feedback');"
            ondragleave="removeHighlight('await-feedback')" ondragover="allowDrop(event); highlight('await-feedback');">
          </div>
        </figure>

        <figure>
          <div class="category">
            <h3>Done</h3>
          </div>
          <div id="done" class="task-cards" ondrop="moveTo('Done'); removeHighlight('done');"
            ondragleave="removeHighlight('done')" ondragover="allowDrop(event); highlight('done');">
          </div>
        </figure>
      </article>
      <dialog onload="logDownWBubblingProtection(event)" id="add-task" class="add-task">
        <form onsubmit="addToTasks(event)" onclick="logDownWBubblingProtection(event)" id="task-form" novalidate>
          <div class="add-task-content">
            <h1>Add Task <button onclick="addTaskClose()" type="button">
                <img src="./assets/img/cancel.svg" alt="cancel" />
              </button></h1>

            <div>
              <div class="formular">
                <div class="form-area">
                  <div class="form-area-fields">
                    <label for="title">Title<span style="color: rgba(255, 129, 144, 1)">*</span></label>
                    <input id="title" type="text" placeholder="Enter a title" />
                    <div class="validation-message" id="validation-message"></div>
                  </div>

                  <div class="form-area-fields">
                    <label for="description">Description</label>
                    <div class="custom-textarea">
                      <textarea oninput="limitTextarea(this);" id="description" name="description"
                        placeholder="Enter a Description"></textarea>
                      <img src="./assets/img/Recurso.svg" alt="Recurso" class="resize-handle"
                        onmousedown="startResize(event, 'description')" draggable="false">
                    </div>
                  </div>

                  <div class="form-area-fields">
                    <label for="due-date">Due date<span style="color: rgba(255, 129, 144, 1)">*</span></label>
                    <div id="date-input" class="date-input" onclick="document.getElementById('due-date').showPicker()">
                      <input type="date" id="due-date" name="due-date" required />
                      <img src="./assets/img/event.svg" alt="calender">
                    </div>
                    <div class="validation-message" id="validation-message"></div>
                  </div>
                </div>

                <div class="form-line"></div>

                <div class="form-area">
                  <div class="form-area-fields">
                    <label>Priority</label>
                    <div class="priority">
                      <input class="radio__input" type="radio" id="urgent" name="priority" value="urgent" />
                      <label class="radio__label-urgent" for="urgent">Urgent <img src="./assets/img/urgent.svg"
                          alt="urgent" /></label>

                      <input class="radio__input" type="radio" id="medium" name="priority" value="medium" />
                      <label class="radio__label-medium" for="medium">Medium <img src="./assets/img/medium.svg"
                          alt="medium" /></label>

                      <input class="radio__input" type="radio" id="low" name="priority" value="low" />
                      <label class="radio__label-low" for="low">Low <img src="./assets/img/low.svg" alt="low" /></label>
                    </div>
                  </div>

                  <div class="form-area-fields">
                    <label for="contacts">Assigned to</label>
                    <div class="assigned-to">
                      <div class="custom-selectbox" onclick="toggleContactList()">
                        <input type="search" id="contacts" name="contacts" placeholder="Select contacts to assign"
                          oninput="searchContacts();" />
                        <div id="contacts-arrow" class="arrow">
                          <img src="./assets/img/arrow_drop_down.svg" alt="arrow_drop_down" />
                        </div>
                      </div>

                      <div class="contact-list display-none" id="contact-list"></div>
                    </div>
                    <div id="contact-line" class="contact-line"></div>
                  </div>

                  <div class="form-area-fields">
                    <label>Category<span style="color: rgba(255, 129, 144, 1)">*</span></label>

                    <div class="custom-select">
                      <div class="custom-selectbox" style="padding-left: 15px" onclick="toggleCategoryOptions()"
                        id="custom-category-input">
                        <input type="text" name="category" id="category-input" placeholder="Select task category"
                          class="category-input">
                        <div class="arrow" id="category-arrow">
                          <img src="./assets/img/arrow_drop_down.svg" alt="arrow_drop_down" />
                        </div>
                      </div>
                      <div class="validation-message" id="validation-message"></div>
                      <div class="category-options display-none" id="category-options">
                        <div onclick="selectCategory('Technical Task')">Technical Task</div>
                        <div onclick="selectCategory('User Story')">User Story</div>
                      </div>

                    </div>
                  </div>

                  <div class="form-area-fields">
                    <label for="subtask">Subtasks</label>
                    <div class="subtask-input-container">
                      <input id="subtask" type="text" placeholder="Add new subtask" />

                      <div class="subtask-actions">
                        <button onclick="clearSubtask()" type="button"><img src="./assets/img/cancel.svg"
                            alt="close"></button>
                        <div class="line"></div>
                        <button onclick="addSubtask()" type="button"><img src="./assets/img/checkblue.svg"
                            alt="check"></button>
                      </div>
                    </div>

                    <ul class="subtask-interaction" id="subtask-interaction"></ul>

                  </div>
                </div>
              </div>

              <div class="form-footer">
                <div>
                  <span style="color: rgba(255, 129, 144, 1); font-size: 20px">*</span>This field is required
                </div>

                <div>
                  <button onclick="addTaskClose();" class="cancel" type="button">
                    Cancel<img class="button-icon" src="./assets/img/cancel.svg" alt="cancel" /><img
                      class="button-icon-hover" src="./assets/img/cancelhover.svg" alt="cancelhover" />
                  </button>
                  <button class="create-task" type="submit">
                    <input id="create-task" value="Create Task" type="submit" /><img src="./assets/img/check.svg"
                      alt="check" />
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
        </div>
      </dialog>




      <dialog class="task" onload="logDownWBubblingProtection(event)" id="task">

      </dialog>
    </section>
    <dialog id="success-dialog" class="success-dialog">Task added to board <img src="./assets/img/Iconshover.svg"
        alt="success"></dialog>
  </main>
</body>

</html>
