<!DOCTYPE html>
<html lang="com">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/Capa 1.svg" type="image/x-icon">
    <script src="./scripts/board.js"></script>
    <link rel="stylesheet" href="./css/board.css">
    <title>Join - Board</title>
</head>

<body onclick="submenuClose(); addTaskClose();">
    <header>
        <nav>
            <h2>Kanban Project Management Tool</h2>
            <div><img src="./assets/img/help.svg" alt="help"><button
                    onclick="submenuOpen(); logDownWBubblingProtection(event);">G</button></div>

        </nav>
        <dialog onload="logDownWBubblingProtection(event);" id="submenu" class="submenu">
            <a href="./index.html">Legal Notice</a>
            <a href="">Privacy Policy</a>
            <a href="">Log out</a>
        </dialog>
    </header>
    <main>
        <div class="menu">
            <img src="./assets/img/Join logo vector.svg" alt="join logo">
            <nav>
                <ul>
                    <a class="menu-top" href="./summary.html"><img src="./assets/img/Vector.svg"
                            alt="vector.svg">Summary</a>
                    <a class="menu-top" href=""><img src="./assets/img/edit_square.svg" alt="edit square png">Add
                        Task</a>
                    <a class="current-page" href=""><img src="./assets/img/Iconshover.svg" alt="board icon">Board</a>
                    <a class="menu-top" href=""><img src="./assets/img/perm_contact_calendar.svg"
                            alt="perm contact calendar.svg">Contacts</a>
                </ul>

                <ul>
                    <a class="menu-bottom" href="">Privacy Policy</a>
                    <a class="menu-bottom" href="">Legal notice</a>
                </ul>
            </nav>
        </div>

        <section>
            <div class="title">
                <h1>Board</h1>

                <span>
                    <div class="searchbar"><input type="text" id="search-bar" placeholder="Find Task">
                        <div></div>
                        <button class="search-btn"><img src="./assets/img/search.svg" alt="search svg"></button>
                    </div>

                    <button class="add-task-btn" onclick="addtaskOpen(); logDownWBubblingProtection(event);">Add task
                        <img src="./assets/img/add.svg" alt="add svg"></button>
                </span>

            </div>
            <article>
                <figure>
                    <div class="category">
                        <h3>To do</h3>
                        <button onclick="addtaskOpen(); logDownWBubblingProtection(event);"><img
                                src="./assets/img/plus button.svg" alt="add svg"></button>
                    </div>
                    <div class="no-task">
                        No tasks To do
                    </div>
                </figure>

                <figure>
                    <div class="category">
                        <h3>In progress</h3>
                        <button onclick="addtaskOpen(); logDownWBubblingProtection(event);"><img
                                src="./assets/img/plus button.svg" alt="add svg"></button>
                    </div>
                    <button class="task-card">
                        <h4>User Story</h4>
                        <p>
                            <strong>Kochwelt Page & Recipe Recommender</strong>
                            Build start page with recipe recommendation...
                        </p>
                        <div class="progress-bar">
                            <progress id="subtasks" value="1" max="2"></progress>
                            <label for="subtasks">1/2 Subtasks</label>
                        </div>
                        <div class="user-prio">
                            <span>
                                <div>AA</div>
                                <div class="margin-left">EJ</div>
                                <div class="margin-left">MA</div>
                            </span>
                            <img src="./assets/img/Prio media.svg" alt="medium">
                        </div>
                    </button>
                </figure>

                <figure>
                    <div class="category">
                        <h3>Await feedback</h3>
                        <button onclick="addtaskOpen(); logDownWBubblingProtection(event);"><img
                                src="./assets/img/plus button.svg" alt="add svg"></button>
                    </div>
                </figure>

                <figure>
                    <div class="category">
                        <h3>Done</h3>
                    </div>
                </figure>
            </article>
            <dialog onload="logDownWBubblingProtection(event);" id="add-task" class="add-task">
                <div class="add-task-content" onclick="logDownWBubblingProtection(event);">
                    <h1>Add Task <button onclick="addTaskClose();"><img src="./assets/img/cancel.svg"
                                alt="cancel"></button></h1>

                    <form action="">

                        <div class="formular">
                            <div class="form-area">
                                <div class="form-area-fields">
                                    <label for="title">Title<span
                                            style="color: rgba(255, 129, 144, 1);">*</span></label>
                                    <input id="title" type="text" placeholder="Enter a title" required>
                                </div>

                                <div class="form-area-fields">
                                    <label for="description">Description</label>
                                    <textarea id="description" name="description" rows="4" cols="20"
                                        placeholder="Enter a Description"></textarea>
                                </div>

                                <div class="form-area-fields">
                                    <label for="due-date">Due date<span
                                            style="color: rgba(255, 129, 144, 1);">*</span></label>
                                    <input type="date" id="due-date" name="due-date" required>
                                </div>
                            </div>

                            <div class="form-line"></div>

                            <div class="form-area">

                                <div class="form-area-fields">
                                    <legend>Priority</legend>
                                    <div class="priority">
                                        <input class="radio__input" type="radio" id="urgent" name="priority"
                                            value="urgent">
                                        <label class="radio__label-urgent" for="urgent">Urgent <img
                                                src="./assets/img/urgent.svg" alt="urgent"></label>

                                        <input class="radio__input" type="radio" id="medium" name="priority"
                                            value="medium">
                                        <label class="radio__label-medium" for="medium">Medium <img
                                                src="./assets/img/medium.svg" alt="medium"></label>

                                        <input class="radio__input" type="radio" id="low" name="priority" value="low">
                                        <label class="radio__label-low" for="low">Low <img src="./assets/img/low.svg"
                                                alt="low"></label>
                                    </div>
                                </div>


                                <div class="form-area-fields">
                                    <label for="contacts">Assigned to</label>
                                    <div class="assigned-to">
                                        <div class="select-contacts" onclick="toggleContactList()">
                                            <input type="search" id="contacts" name="contacts"
                                                placeholder="Select contacts to assign">
                                            <div class="arrow"><img src="./assets/img/arrow_drop_down.svg"
                                                    alt="arrow_drop_down"></div>
                                        </div>

                                        <div class="contact-list display-none" id="contact-list">

                                            <input class="checkbox-input" type="checkbox" id="assign-contact1"
                                                name="assign-contact1">
                                            <label class="custom-checkbox" for="assign-contact1">
                                                <span></span>
                                                <img src="./assets/img/checked.svg" alt="checked">
                                                <div class="contact-name">
                                                    <div>AA</div>Armin Alert
                                                </div>
                                            </label>

                                            <input class="checkbox-input" type="checkbox" id="assign-contact2"
                                                name="assign-contact2">
                                            <label class="custom-checkbox" for="assign-contact2">
                                                <span></span>
                                                <img src="./assets/img/checked.svg" alt="checked">
                                                <div class="contact-name">
                                                    <div style="background-color: rgba(0, 190, 232, 1);">EJ</div>Eren
                                                    Jäger
                                                </div>
                                            </label>

                                            <input class="checkbox-input" type="checkbox" id="assign-contact3"
                                                name="assign-contact3">
                                            <label class="custom-checkbox" for="assign-contact3">
                                                <span></span>
                                                <img src="./assets/img/checked.svg" alt="checked">
                                                <div class="contact-name">
                                                    <div style="background-color: rgba(0, 190, 232, 1);">AA</div>Mikasa
                                                    Ackermann
                                                </div>
                                            </label>

                                        </div>
                                    </div>
                                </div>

                                <div class="form-area-fields">
                                    <label for="category">Category<span
                                            style="color: rgba(255, 129, 144, 1);">*</span></label>
                                    <select name="category" id="select-category" required>
                                        <option value="Technical Task">Technical Task</option>
                                        <option value="User Story">User Story</option>
                                    </select>
                                </div>

                                <div class="form-area-fields">
                                    <label for="subtask">Subtasks</label>
                                    <input id="subtask" type="text" placeholder="Add new subtask">
                                </div>
                            </div>
                        </div>

                        <div class="form-footer">
                            <div>
                                <span style="color: rgba(255, 129, 144, 1); font-size: 20px;">*</span>This field is
                                required
                            </div>

                            <div>
                                <button onclick="addTaskClose();" class="cancel">Cancel<img class="button-icon"
                                        src="./assets/img/cancel.svg" alt="cancel"><img class="button-icon-hover"
                                        src="./assets/img/cancelhover.svg" alt="cancelhover"></button>
                                <button class="create-task"><input type="submit" value="Create Task"><img
                                        src="./assets/img/check.svg" alt="check"></button>
                            </div>
                        </div>

                    </form>
                </div>
            </dialog>
        </section>
    </main>
</body>

</html>
