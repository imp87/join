<!doctype html>
<html lang="com">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./scripts/board.js"></script>
  <script src="./scripts/task.js"></script>
  <script src="./scripts/script.js"></script>
  <script src="./scripts/tasktemplate.js"></script>
  <link rel="stylesheet" href="./css/board.css" />
  <link rel="stylesheet" href="./css/task.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>Join - Task</title>
</head>

<body>
  <header>
    <nav>
      <h2>Kanban Project Management Tool</h2>
      <div>
        <img src="./assets/img/help.svg" alt="help" /><button onclick="
              submenuOpen();
              logDownWBubblingProtection(event);
            ">
          G
        </button>
      </div>
    </nav>
    <dialog onload="logDownWBubblingProtection(event)" id="submenu" class="submenu">
      <a href="./index.html">Legal Notice</a>
      <a href="">Privacy Policy</a>
      <a href="">Log out</a>
    </dialog>
  </header>
  <main>
    <div class="menu">
      <img src="./assets/img/Join logo vector.svg" alt="join logo" />
      <nav>
        <ul>
          <a class="menu-top" href="./summary.html"><img src="./assets/img/Vector.svg" alt="vector.svg" />Summary</a>
          <a class="current-page"><img src="./assets/img/edit_square.svg" alt="edit square png" />Add Task</a>
          <a class="menu-top" href="./board.html"><img src="./assets/img/Iconshover.svg" alt="board icon" />Board</a>
          <a class="menu-top" href="./contacts.html"><img src="./assets/img/perm_contact_calendar.svg"
              alt="perm contact calendar.svg" />Contacts</a>
        </ul>

        <ul>
          <a class="menu-bottom" href="">Privacy Policy</a>
          <a class="menu-bottom" href="">Legal notice</a>
        </ul>
      </nav>
    </div>
    <section>
      <form onsubmit="addToTasks()">
        <div class="add-task-content">
          <h1>Add Task</h1>

          <div>
            <div class="formular">
              <div class="form-area">
                <div class="form-area-fields">
                  <label for="title">Title<span style="color: rgba(255, 129, 144, 1)">*</span></label>
                  <input id="title" type="text" placeholder="Enter a title" required />
                </div>

                <div class="form-area-fields">
                  <label for="description">Description</label>
                  <textarea id="description" name="description" rows="4" cols="20"
                    placeholder="Enter a Description"></textarea>
                </div>

                <div class="form-area-fields">
                  <label for="due-date">Due date<span style="color: rgba(255, 129, 144, 1)">*</span></label>
                  <input type="date" id="due-date" name="due-date" required />
                </div>
              </div>

              <div class="form-line"></div>

              <div class="form-area">
                <div class="form-area-fields">
                  <label>Priority</label>
                  <div class="priority">
                    <input class="radio__input" type="radio" id="urgent" name="priority" value="urgent" />
                    <label class="radio__label-urgent" for="urgent">Urgent <img src="./assets/img/urgent.svg"
                        alt="urgent" /></label>

                    <input class="radio__input" type="radio" id="medium" name="priority" value="medium" />
                    <label class="radio__label-medium" for="medium">Medium <img src="./assets/img/medium.svg"
                        alt="medium" /></label>

                    <input class="radio__input" type="radio" id="low" name="priority" value="low" />
                    <label class="radio__label-low" for="low">Low <img src="./assets/img/low.svg" alt="low" /></label>
                  </div>
                </div>

                <div class="form-area-fields">
                  <label for="contacts">Assigned to</label>
                  <div class="assigned-to">
                    <div class="custom-selectbox" onclick="toggleContactList()">
                      <input type="search" id="contacts" name="contacts" placeholder="Select contacts to assign" />
                      <div id="contacts-arrow" class="arrow">
                        <img src="./assets/img/arrow_drop_down.svg" alt="arrow_drop_down" />
                      </div>
                    </div>

                    <div class="contact-list display-none" id="contact-list"></div>
                  </div>
                  <div id="contact-line" class="contact-line"></div>
                </div>

                <div class="form-area-fields">
                  <label>Category<span style="color: rgba(255, 129, 144, 1)">*</span></label>

                  <div class="custom-select">
                    <div class="custom-selectbox" style="padding-left: 15px" onclick="toggleCategoryOptions()">
                      <span id="category-selected">Select task category</span>
                      <div class="arrow" id="category-arrow">
                        <img src="./assets/img/arrow_drop_down.svg" alt="arrow_drop_down" />
                      </div>
                    </div>

                    <div class="category-options display-none" id="category-options">
                      <div onclick="selectCategory('Technical Task')">Technical Task</div>
                      <div onclick="selectCategory('User Story')">User Story</div>
                    </div>

                    <input type="hidden" name="category" id="category-input" required>
                  </div>
                </div>

                <div class="form-area-fields">
                  <label for="subtask">Subtasks</label>
                  <div class="subtask-input-container">
                    <input id="subtask" type="text" placeholder="Add new subtask" />

                    <div class="subtask-actions">
                      <button onclick="clearSubtask()" type="button"><img src="./assets/img/cancel.svg"
                          alt="close"></button>
                      <div class="line"></div>
                      <button onclick="addSubtask()" type="button"><img src="./assets/img/checkblue.svg"
                          alt="check"></button>
                    </div>
                  </div>

                  <ul class="subtask-interaction" id="subtask-interaction"></ul>

                </div>
              </div>
            </div>

            <div class="form-footer">
              <div>
                <span style="color: rgba(255, 129, 144, 1); font-size: 20px">*</span>This field is required
              </div>

              <div>
                <button onclick="addTaskClose()" class="cancel" type="button">
                  Clear<img class="button-icon" src="./assets/img/cancel.svg" alt="cancel" /><img
                    class="button-icon-hover" src="./assets/img/cancelhover.svg" alt="cancelhover" />
                </button>
                <button class="create-task" type="submit">
                  <input id="create-task" value="Create Task" type="submit" /><img src="./assets/img/check.svg"
                    alt="check" />
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>

</html>
