<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="loginBody">

  <div class="loginHeader">
    <img src="/assets/icons/logo.svg" alt="Logo">
    <p>Not a Join user?
      <button type="button">Sign up</button>
    </p>
  </div>

  <main id="mainContent">

    <div class="loginFormWrapper">
      <form id="loginForm" novalidate>
        <h2>Log in</h2>
        <div class="inputWrapper">
          <input type="email" id="email" placeholder="E-Mail">
          <img src="./assets/icons/email.svg" alt="E-Mail Icon" class="iconMail">
          <input type="password" id="password" placeholder="Password" >
          <img src="./assets/icons/password.svg" alt="Password Icon" class="iconPassword">
        </div>

        <div class="loginButtons">
          <button type="submit" id="userLogin">Log in</button>
          <button type="button" id="guestLogin">Guest Login</button>
        </div>
      </form>
    </div>
    </div>

  </main>

  <footer>
    <div class="footerLinks">
      <a href="#">Privacy Policy</a>
      <a href="#">Legal notice</a>
    </div>
  </footer>

</body>

</html>
