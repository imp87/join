<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/login.css">

</head>

<body class="loginBody">

  <div id="startScreen">
    <img src="./assets/icons/logo.svg" alt="Join Logo" class="startLogo">
  </div>


  <div class="loginHeader">
    <img src="./assets/icons/logo.svg" alt="Logo">
    <p>Not a Join user?
      <a href="./pages/signup.html"><button type="button">Sign up</button></a>
    </p>
  </div>

  <main id="mainContent">

    <div class="loginFormWrapper">
      <form id="loginForm" novalidate>
        <h2>Log in</h2>
        <div class="loginInputWrapper">
          <div class="inputWithIcon">
            <input type="email" placeholder="E-Mail" />
            <img src="./assets/icons/mail.svg" alt="" class="inputIcon" />
          </div>
          <div class="inputWithIcon">
            <input type="password" placeholder="Password" />
            <img src="./assets/icons/pw_lock.svg" alt="" class="inputIcon" />
          </div>
          <span class="loginDismatchInfo">
            Check your email and password. Please try again.
          </span>
        </div>


        <!--/////////////////////////////////////////// LOG IN FUNCTIONS ///////////////////////////////////////////////////////////// -->
        <div class="loginButtons">
          <button type="submit" id="userLogin">Log in</button>
          <button type="button" id="guestLogin">Guest Login</button>
        </div>
      </form>
    </div>
    </div>

  </main>

  <footer>
    <div class="footerLinks">
      <a href="./pages/privacy.html">Privacy Policy</a>
      <a href="./pages/legals.html">Legal notice</a>
    </div>
  </footer>
  <script src="./scripts/index.js"></script>
</body>

</html>
