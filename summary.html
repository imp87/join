<!doctype html>
<html lang="com">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/summary.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="./scripts/summary.js"></script>
  <script src="./scripts/task.js"></script>
  <script src="./scripts/board.js"></script>
  <script src="./scripts/auth.js"></script>
  <link rel="shortcut icon" href="./assets/img/Capa 1.svg" type="image/x-icon" />
  <title>Join - Summary</title>
</head>

<body id="body" onload="
      fetchData();
      greeting();
    " onclick="submenuClose()" id="body">
  <header>
    <nav>
      <h2>Kanban Project Management Tool</h2>
      <div>
        <a href="./pages/help.html"><img src="./assets/img/help.svg" alt="help" /></a><button id="userInitials" onclick="
              submenuOpen();
              logDownWBubblingProtection(event);
            ">
          G
        </button>
      </div>
    </nav>
    <dialog onload="logDownWBubblingProtection(event)" id="submenu" class="submenu">
      <a class="help-submenu" href="./assets/img/help.svg">Help</a>
      <a href="./pages/legals.html">Legal Notice</a>
      <a href="./pages/privacy.html">Privacy Policy</a>
      <a href="./index.html" onclick="logoutUser()">Log out</a>
    </dialog>
  </header>

  <main>
    <div class="menu">
      <img src="./assets/img/Join logo vector.svg" alt="join logo" />
      <nav>
        <ul>
          <a class="current-page" href=""><img src="./assets/img/vectorhover.svg" alt="vectorhover.svg" />Summary</a>
          <a class="menu-top" href="./task.html"><img src="./assets/img/edit_square.svg" alt="edit square svg" />Add
            Task</a>
          <a class="menu-top" href="./board.html"><img src="./assets/img/Icons.svg" alt="board icon" />Board</a>
          <a class="menu-top" href="./contacts.html"><img src="./assets/img/perm_contact_calendar.svg"
              alt="perm contact calendar.svg" />Contacts</a>
        </ul>

        <ul>
          <a class="menu-bottom" href="./pages/privacy.html">Privacy Policy</a>
          <a class="menu-bottom" href="./pages/legals.html">Legal notice</a>
        </ul>
      </nav>
    </div>

    <section>
      <div class="title" id="summary-title">
        <h1>Join 360</h1>
        <div></div>
        <h3>Key Metrics at a Glance</h3>
        <span></span>
      </div>
      <article>
        <div id="summary">
          <figure>
            <a href="./board.html">
              <img class="button-icon" src="./assets/img/Frame 59.svg" alt="ellipse" />
              <img class="button-icon-hover" src="./assets/img/ellipsehover.svg" alt="ellipse hover" />
              <span>
                <h4 id="to-do-count"></h4>
                To-do
              </span>
            </a>

            <a href="./board.html">
              <img class="button-icon" src="./assets/img/Group 7.svg" alt="done svg" />
              <img class="button-icon-hover" src="./assets/img/donehover.svg" alt="donehover svg" />
              <span>
                <h4 id="done-count"></h4>
                Done
              </span>
            </a>
          </figure>

          <a href="./board.html" class="deadline">
            <img src="./assets/img/urgent1.svg" alt="urgent png" />
            <span>
              <h4 id="urgent-count"></h4>
              Urgent
            </span>
            <div></div>
            <p id="next-deadline"></p>
          </a>

          <figure>
            <a href="./board.html">
              <span>
                <h4 id="tasks-count"></h4>
                Tasks in Board
              </span>
            </a>

            <a href="./board.html">
              <span>
                <h4 id="progress-count"></h4>
                Tasks in Progress
              </span>
            </a>

            <a href="./board.html">
              <span>
                <h4 id="feedback-count"></h4>
                Awaiting Feedback
              </span>
            </a>
          </figure>
        </div>
        <div id="greeting" class="greeting"></div>
      </article>
    </section>
  </main>
</body>

</html>
