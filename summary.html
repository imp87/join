<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/summary.css">
    <title>Join - Summary</title>
</head>

<body>
    <header>
        <nav>
            <h2>Kanban Project Management Tool</h2>
            <div><img src="./assets/img/help.png" alt="help"><button>G</button></div>
        </nav>
    </header>

    <main>
        <div class="menu">
            <img src="./assets/img/Join logo vector.png" alt="join logo">
            <nav>
                <ul>
                    <a href=""><img src="./assets/img/Vector.png" alt="vector.png">Summary</a>
                    <a href=""><img src="./assets/img/edit_square.png" alt="edit square png">Add Task</a>
                    <a href=""><img src="./assets/img/Icons.png" alt="board icon">Board</a>
                    <a href=""><img src="./assets/img/perm_contact_calendar.png"
                            alt="perm contact calendar.png">Contacts</a>
                </ul>

                <ul>
                    <a class="menu-bottom" href="">Privacy Policy</a>
                    <a class="menu-bottom" href="">Legal notice</a>
                </ul>
            </nav>
        </div>

        <section>
            <div class="title">
                <h1>Join 360</h1>
                <div></div>
                <h3>Key Metrics at a Glance</h3>
            </div>
            <article>
                <div>
                    <figure>
                        <button>
                            <img src="./assets/img/Frame 59.png" alt="ellipse">
                            <span>
                                <h4>1</h4>
                                To-do
                            </span>
                        </button>

                        <button>
                            <img src="./assets/img/Group 7.png" alt="done png">
                            <span>
                                <h4>1</h4>
                                Done
                            </span>
                        </button>
                    </figure>

                    <button>
                        <img src="./assets/img/urgent.png" alt="urgent png">
                        <span>
                            <h4>1</h4>
                            Urgent
                        </span>
                        <div>

                        </div>
                        <p>
                            <strong>October 16, 2022</strong>
                            Upcoming Deadline
                        </p>
                    </button>

                    <figure>
                        <button>
                            <span>
                                <h4>5</h4>
                                Tasks in Board
                            </span>
                        </button>

                        <button>
                            <span>
                                <h4>2</h4>
                                Tasks in Progress
                            </span>
                        </button>

                        <button>
                            <span>
                                <h4>2</h4>
                                Awaiting Feedback
                            </span>
                        </button>
                    </figure>
                </div>
                <div>
                    <h5>Good morning!</h5>
                </div>
            </article>
        </section>
